name: ICLR27 public theory candidate collection
on:
  push:
    branches:
      - research/iclr27-rubric-eval-20261111
    paths:
      - .github/workflows/iclr27-collect.yml
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install upstream OpenReview downloader and PDF parser
        run: pip install --quiet openreview_downloader pymupdf
      - name: Collect public ICLR27 high-score theory pool and probe OpenReview
        run: python scripts/iclr27_collect.py
      - name: Upload full public candidate report and fetched PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iclr27-theory-pilot
          path: data/iclr27_probe/
          if-no-files-found: warn
      - name: Commit compact public candidate report to this isolated branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/iclr27_probe/*.csv data/iclr27_probe/*.json
          git diff --cached --quiet || git commit -m "Record scored ICLR27 theory candidates and OpenReview probe"
          git push
